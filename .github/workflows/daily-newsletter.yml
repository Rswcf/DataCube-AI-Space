name: Daily Newsletter

# Sends yesterday's collected content as a newsletter at 08:00 Berlin time.
# Data is collected the previous day at 23:xx (see daily-collect.yml).
# This workflow fires the morning after to deliver the digest.

on:
  schedule:
    # Two cron slots to cover DST transitions and absorb GitHub Actions cron
    # delay (typically 5-60 min, occasionally 1-2h under load).
    # Schedule ~2h earlier than target delivery so even a delayed run lands
    # inside the acceptable Berlin 06-10 window.
    # - Summer (CEST, UTC+2): 04:07 UTC = 06:07 Berlin (+ delay = 06-10 Berlin)
    # - Winter (CET,  UTC+1): 05:07 UTC = 06:07 Berlin (+ delay = 06-10 Berlin)
    # Minute :07 (not :00) avoids GitHub's documented on-the-hour load spike.
    - cron: "7 4 * * *"
    - cron: "7 5 * * *"
  workflow_dispatch:
    inputs:
      period_id:
        description: "Period ID to send newsletter for (e.g. 2026-04-10). Default: yesterday"
        required: false

jobs:
  send:
    name: Send daily newsletter
    runs-on: ubuntu-latest
    steps:
      - name: Determine period
        id: period
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            BERLIN_HOUR=$(TZ=Europe/Berlin date +%H)
            # Accept 06-10 Berlin: covers both DST states and absorbs cron delay.
            # Backend idempotency (newsletter_sends table) protects against the
            # case where both cron slots succeed on the same day.
            case "$BERLIN_HOUR" in
              06|07|08|09|10) ;;
              *)
                echo "Skip: Berlin hour $BERLIN_HOUR outside 06-10 delivery window"
                echo "SKIP=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi

          PERIOD="${{ github.event.inputs.period_id }}"
          if [ -z "$PERIOD" ]; then
            # Default: yesterday in Berlin time (content collected last night at 23:xx)
            PERIOD=$(TZ=Europe/Berlin date -d "yesterday" +%F)
          fi
          echo "PERIOD=$PERIOD" >> "$GITHUB_OUTPUT"
          echo "SKIP=false" >> "$GITHUB_OUTPUT"
          echo "Will send newsletter for $PERIOD"

      - name: Verify content exists
        id: verify
        if: steps.period.outputs.SKIP != 'true'
        run: |
          PERIOD="${{ steps.period.outputs.PERIOD }}"
          echo "Verifying content for $PERIOD..."

          COUNTER='import json,sys;cnt=lambda v:len(v) if isinstance(v,list) else (sum(cnt(x) for x in v.values()) if isinstance(v,dict) else 0);print(cnt(json.load(sys.stdin)))'
          T1=$(curl -sS "${{ secrets.API_BASE_URL }}/tech/${PERIOD}"       --http1.1 --max-time 30 | python3 -c "$COUNTER" 2>/dev/null || echo 0)
          T2=$(curl -sS "${{ secrets.API_BASE_URL }}/tips/${PERIOD}"       --http1.1 --max-time 30 | python3 -c "$COUNTER" 2>/dev/null || echo 0)
          T3=$(curl -sS "${{ secrets.API_BASE_URL }}/investment/${PERIOD}" --http1.1 --max-time 30 | python3 -c "$COUNTER" 2>/dev/null || echo 0)
          TOTAL=$((T1 + T2 + T3))

          echo "Content items found: total=$TOTAL (tech=$T1 tips=$T2 inv=$T3)"

          if [ "$TOTAL" -gt 0 ]; then
            echo "HAS_CONTENT=true" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_CONTENT=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: no content for $PERIOD — skipping newsletter"
          fi

      - name: Send newsletter
        if: steps.verify.outputs.HAS_CONTENT == 'true'
        run: |
          set +e
          PERIOD="${{ steps.period.outputs.PERIOD }}"
          echo "Sending newsletter for period: $PERIOD"
          HTTP_CODE=$(curl -sS -o nl-response.json -w "%{http_code}" \
            -X POST "${{ secrets.API_BASE_URL }}/admin/newsletter?period_id=${PERIOD}&wait=true" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}" \
            --http1.1 \
            --max-time 300)
          if [ -f nl-response.json ]; then cat nl-response.json; echo ""; fi
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Newsletter sent successfully (HTTP $HTTP_CODE)"
          else
            echo "ERROR: Newsletter API returned HTTP $HTTP_CODE"
            exit 1
          fi
