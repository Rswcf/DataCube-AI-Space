name: Daily Collection

on:
  schedule:
    # Fire at both possible UTC slots. The shell logic below maps each slot to
    # the intended Berlin-day period and tolerates delayed starts that drift
    # past midnight.
    - cron: "7 21 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:
    inputs:
      period_id:
        description: "Period ID (e.g. 2026-02-08 or 2026-kw06)"
        required: false

jobs:
  collect:
    name: Trigger daily collection
    runs-on: ubuntu-latest
    steps:
      - name: Determine period
        id: period
        run: |
          PERIOD="${{ github.event.inputs.period_id }}"
          if [ -n "$PERIOD" ]; then
            echo "PERIOD=$PERIOD" >> "$GITHUB_OUTPUT"
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
            echo "Using manually requested period $PERIOD"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "schedule" ]; then
            PERIOD=$(TZ=Europe/Berlin date +%F)
            echo "PERIOD=$PERIOD" >> "$GITHUB_OUTPUT"
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SCHEDULE="${{ github.event.schedule }}"
          BERLIN_HOUR=$(TZ=Europe/Berlin date +%H)
          BERLIN_OFFSET=$(TZ=Europe/Berlin date +%z)
          BERLIN_TODAY=$(TZ=Europe/Berlin date +%F)
          BERLIN_YESTERDAY=$(TZ=Europe/Berlin date -d "yesterday" +%F)

          case "$SCHEDULE" in
            "7 21 * * *")
              # CEST primary slot: nominally 23:07 Berlin. If GitHub starts
              # this run late after midnight, still collect the previous day.
              if [ "$BERLIN_OFFSET" != "+0200" ]; then
                echo "Skip: 21:07 UTC slot only applies during CEST (+0200); offset=$BERLIN_OFFSET"
                echo "SKIP=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              case "$BERLIN_HOUR" in
                23)
                  PERIOD="$BERLIN_TODAY"
                  ;;
                00|01|02)
                  PERIOD="$BERLIN_YESTERDAY"
                  ;;
                *)
                  echo "Skip: 21:07 UTC slot outside Berlin 23-02 window (hour=$BERLIN_HOUR)"
                  echo "SKIP=true" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
              ;;
            "7 22 * * *")
              if [ "$BERLIN_OFFSET" = "+0100" ]; then
                # CET primary slot: nominally 23:07 Berlin.
                case "$BERLIN_HOUR" in
                  23)
                    PERIOD="$BERLIN_TODAY"
                    ;;
                  00|01|02)
                    PERIOD="$BERLIN_YESTERDAY"
                    ;;
                  *)
                    echo "Skip: 22:07 UTC CET slot outside Berlin 23-02 window (hour=$BERLIN_HOUR)"
                    echo "SKIP=true" >> "$GITHUB_OUTPUT"
                    exit 0
                    ;;
                esac
              else
                # CEST backup slot: nominally 00:07 Berlin next day. Use it to
                # recover the previous day's collection if the 21:07 UTC run was
                # delayed or skipped.
                case "$BERLIN_HOUR" in
                  00|01|02)
                    PERIOD="$BERLIN_YESTERDAY"
                    ;;
                  *)
                    echo "Skip: 22:07 UTC CEST backup slot only runs in Berlin 00-02 window (hour=$BERLIN_HOUR)"
                    echo "SKIP=true" >> "$GITHUB_OUTPUT"
                    exit 0
                    ;;
                esac
              fi
              ;;
            *)
              echo "Skip: unexpected schedule expression '$SCHEDULE'"
              echo "SKIP=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "PERIOD=$PERIOD" >> "$GITHUB_OUTPUT"
          echo "SKIP=false" >> "$GITHUB_OUTPUT"
          echo "Resolved period $PERIOD from schedule '$SCHEDULE' at Berlin hour $BERLIN_HOUR"

      - name: Skip if period already collected
        id: existing
        if: steps.period.outputs.SKIP != 'true'
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "SKIP_TRIGGER=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PERIOD="${{ steps.period.outputs.PERIOD }}"
          echo "Checking whether $PERIOD already has collection data..."

          HTTP_CODE=$(curl -sS -o status.json -w "%{http_code}" \
            "${{ secrets.API_BASE_URL }}/admin/collect/status?period_id=${PERIOD}" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}" \
            --http1.1 \
            --max-time 30 || true)

          if [ "$HTTP_CODE" = "200" ]; then
            STATUS=$(python3 -c "import json; print(json.load(open('status.json')).get('status', 'unknown'))" 2>/dev/null || echo "unknown")
            echo "Existing collection status for $PERIOD: $STATUS"
            case "$STATUS" in
              running|completed|empty)
                echo "SKIP_TRIGGER=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          else
            echo "Status endpoint unavailable (HTTP ${HTTP_CODE:-000}); falling back to content presence check"
          fi

          COUNTER='import json,sys;cnt=lambda v:len(v) if isinstance(v,list) else (sum(cnt(x) for x in v.values()) if isinstance(v,dict) else 0);print(cnt(json.load(sys.stdin)))'
          T1=$(curl -sS "${{ secrets.API_BASE_URL }}/tech/${PERIOD}"       --http1.1 --max-time 30 | python3 -c "$COUNTER" 2>/dev/null || echo 0)
          T2=$(curl -sS "${{ secrets.API_BASE_URL }}/tips/${PERIOD}"       --http1.1 --max-time 30 | python3 -c "$COUNTER" 2>/dev/null || echo 0)
          T3=$(curl -sS "${{ secrets.API_BASE_URL }}/investment/${PERIOD}" --http1.1 --max-time 30 | python3 -c "$COUNTER" 2>/dev/null || echo 0)
          TOTAL=$((T1 + T2 + T3))
          echo "Existing content for $PERIOD: total=$TOTAL (tech=$T1 tips=$T2 inv=$T3)"

          if [ "$TOTAL" -gt 0 ]; then
            echo "SKIP_TRIGGER=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIP_TRIGGER=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger collection
        id: trigger
        if: steps.period.outputs.SKIP != 'true' && steps.existing.outputs.SKIP_TRIGGER != 'true'
        run: |
          set +e
          PERIOD="${{ steps.period.outputs.PERIOD }}"

          URL="${{ secrets.API_BASE_URL }}/admin/collect?week_id=${PERIOD}"
          echo "Triggering async collection: $URL"

          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$URL" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}" \
            --http1.1 \
            --max-time 60)

          if [ -f response.json ]; then cat response.json; echo ""; fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Collection triggered (HTTP $HTTP_CODE)"
            echo "TRIGGERED=true" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: API returned HTTP $HTTP_CODE"
            echo "TRIGGERED=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Wait for collection to complete
        id: poll
        if: steps.trigger.outputs.TRIGGERED == 'true'
        run: |
          PERIOD="${{ steps.period.outputs.PERIOD }}"
          echo "Polling collection status for $PERIOD (up to 60 min)..."

          # Poll /admin/collect/status every 60s, up to 60 minutes.
          # Stage 3.5 (translations) has no hard cap and can run long; a wider
          # budget avoids false timeouts that would otherwise race with the
          # still-running backend (POST /admin/collect does not serialize
          # concurrent runs per period_id).
          STATUS_ERRORS=0
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -sS -o status.json -w "%{http_code}" \
              "${{ secrets.API_BASE_URL }}/admin/collect/status?period_id=${PERIOD}" \
              -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}" \
              --http1.1 \
              --max-time 30)

            if [ "$HTTP_CODE" -ne 200 ]; then
              STATUS_ERRORS=$((STATUS_ERRORS + 1))
              echo "Attempt $i/60: HTTP $HTTP_CODE (status endpoint error)"
              if [ -f status.json ]; then cat status.json; echo ""; fi
              if [ "$STATUS_ERRORS" -ge 3 ]; then
                echo "Status endpoint unavailable, falling back to content polling..."
                # Recursive list-counter works for /tech (flat), /tips (flat), and /investment (nested).
                COUNTER='import json,sys;cnt=lambda v:len(v) if isinstance(v,list) else (sum(cnt(x) for x in v.values()) if isinstance(v,dict) else 0);print(cnt(json.load(sys.stdin)))'
                T1=$(curl -sS "${{ secrets.API_BASE_URL }}/tech/${PERIOD}"       --http1.1 --max-time 30 | python3 -c "$COUNTER" 2>/dev/null || echo 0)
                T2=$(curl -sS "${{ secrets.API_BASE_URL }}/tips/${PERIOD}"       --http1.1 --max-time 30 | python3 -c "$COUNTER" 2>/dev/null || echo 0)
                T3=$(curl -sS "${{ secrets.API_BASE_URL }}/investment/${PERIOD}" --http1.1 --max-time 30 | python3 -c "$COUNTER" 2>/dev/null || echo 0)
                TOTAL=$((T1 + T2 + T3))
                echo "Fallback poll $i/60: $TOTAL items total (tech=$T1 tips=$T2 inv=$T3)"
                if [ "$TOTAL" -gt 0 ]; then
                  echo "Content ready via fallback for $PERIOD"
                  echo "RESULT=completed" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
              sleep 60
              continue
            fi

            STATUS_ERRORS=0
            STATUS=$(python3 -c "import sys,json; print(json.load(open('status.json')).get('status','unknown'))" 2>/dev/null || echo "unknown")
            STAGE=$(python3 -c "import sys,json; print(json.load(open('status.json')).get('stage',''))" 2>/dev/null || echo "")

            echo "Attempt $i/60: status=$STATUS stage=$STAGE"

            if [ "$STATUS" = "completed" ]; then
              echo "Collection completed for $PERIOD"
              echo "RESULT=completed" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "empty" ]; then
              echo "Collection $STATUS for $PERIOD"
              echo "RESULT=$STATUS" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 60
          done

          # Poll budget exhausted. Decide:
          #   (a) if content was saved (sum across tech+tips+investment > 0),
          #       this is stage3_5 running slow — DE/EN is already visible,
          #       treat as soft success.
          #   (b) if no content exists, the run is genuinely stuck. Fail RED.
          # Do NOT auto-retry — backend has no "already running" guard, a retry
          # here would race the still-running original run (see collector stages
          # 1 and 4 which clear + reinsert rows per period).
          echo "Poll timed out after 60 min. Checking whether content was saved..."
          COUNTER='import json,sys;cnt=lambda v:len(v) if isinstance(v,list) else (sum(cnt(x) for x in v.values()) if isinstance(v,dict) else 0);print(cnt(json.load(sys.stdin)))'
          T1=$(curl -sS "${{ secrets.API_BASE_URL }}/tech/${PERIOD}"       --http1.1 --max-time 30 | python3 -c "$COUNTER" 2>/dev/null || echo 0)
          T2=$(curl -sS "${{ secrets.API_BASE_URL }}/tips/${PERIOD}"       --http1.1 --max-time 30 | python3 -c "$COUNTER" 2>/dev/null || echo 0)
          T3=$(curl -sS "${{ secrets.API_BASE_URL }}/investment/${PERIOD}" --http1.1 --max-time 30 | python3 -c "$COUNTER" 2>/dev/null || echo 0)
          TOTAL=$((T1 + T2 + T3))
          echo "Content items found across tech+tips+investment: $TOTAL (tech=$T1 tips=$T2 inv=$T3)"

          if [ "$TOTAL" -gt 0 ]; then
            echo "Content present despite timeout — treating as completed (stage3_5 likely slow)."
            echo "RESULT=completed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ERROR: 60-min timeout AND no content saved for $PERIOD"
          echo "RESULT=timeout" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Retry on failure
        id: retry
        # Only retry terminal failures. Do NOT include 'timeout' here: without
        # a backend per-period lock, retrying while the original run may still
        # be in progress causes a race in stages 1 and 4 (raw clear + delete/
        # reinsert). The poll step already handles timeout-with-content as a
        # soft success and timeout-without-content as RED.
        if: steps.poll.outputs.RESULT == 'failed' || steps.poll.outputs.RESULT == 'empty'
        run: |
          PERIOD="${{ steps.period.outputs.PERIOD }}"
          echo "Retrying collection for $PERIOD (attempt 2)..."

          HTTP_CODE=$(curl -sS -o retry-response.json -w "%{http_code}" \
            -X POST "${{ secrets.API_BASE_URL }}/admin/collect?week_id=${PERIOD}" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}" \
            --http1.1 \
            --max-time 60)

          if [ -f retry-response.json ]; then cat retry-response.json; echo ""; fi

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Retry trigger failed (HTTP $HTTP_CODE)"
            echo "RETRY_OK=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Retry triggered, polling again (up to 60 min)..."
          RETRY_ERRORS=0
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -sS -o retry-status.json -w "%{http_code}" \
              "${{ secrets.API_BASE_URL }}/admin/collect/status?period_id=${PERIOD}" \
              -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}" \
              --http1.1 --max-time 30)

            if [ "$HTTP_CODE" -ne 200 ]; then
              RETRY_ERRORS=$((RETRY_ERRORS + 1))
              echo "Retry attempt $i/60: HTTP $HTTP_CODE"
              if [ "$RETRY_ERRORS" -ge 3 ]; then
                TOTAL=$(curl -sS "${{ secrets.API_BASE_URL }}/tech/${PERIOD}" --http1.1 --max-time 30 \
                  | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(len(v) for v in d.values() if isinstance(v,list)))" 2>/dev/null || echo "0")
                echo "Fallback poll: $TOTAL articles"
                if [ "$TOTAL" -gt 0 ]; then
                  echo "RETRY_OK=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
              sleep 60
              continue
            fi

            RETRY_ERRORS=0
            STATUS=$(python3 -c "import json; print(json.load(open('retry-status.json')).get('status','unknown'))" 2>/dev/null || echo "unknown")
            echo "Retry attempt $i/60: status=$STATUS"

            if [ "$STATUS" = "completed" ]; then
              echo "Retry succeeded for $PERIOD"
              echo "RETRY_OK=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "empty" ]; then
              echo "Retry also $STATUS for $PERIOD"
              echo "RETRY_OK=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            sleep 60
          done

          echo "Retry timed out for $PERIOD"
          echo "RETRY_OK=false" >> "$GITHUB_OUTPUT"
          exit 1

      # Newsletter is sent by a separate workflow (daily-newsletter.yml) at
      # 08:xx Berlin the next morning, not right after collection at 23:xx.
