name: Daily Collection

on:
  schedule:
    # Fire at both possible UTC slots, then gate in script to Berlin 23:xx.
    - cron: "7 21 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:
    inputs:
      period_id:
        description: "Period ID (e.g. 2026-02-08 or 2026-kw06)"
        required: false

jobs:
  collect:
    name: Trigger daily collection
    runs-on: ubuntu-latest
    steps:
      - name: Determine period
        id: period
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            BERLIN_HOUR=$(TZ=Europe/Berlin date +%H)
            if [ "$BERLIN_HOUR" != "23" ]; then
              echo "Skip: now is not 23:xx in Europe/Berlin (hour=$BERLIN_HOUR)"
              echo "SKIP=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          PERIOD="${{ github.event.inputs.period_id }}"
          if [ -z "$PERIOD" ]; then
            PERIOD=$(TZ=Europe/Berlin date +%F)
          fi
          echo "PERIOD=$PERIOD" >> "$GITHUB_OUTPUT"
          echo "SKIP=false" >> "$GITHUB_OUTPUT"

      - name: Trigger collection
        id: trigger
        if: steps.period.outputs.SKIP != 'true'
        run: |
          set +e
          PERIOD="${{ steps.period.outputs.PERIOD }}"

          URL="${{ secrets.API_BASE_URL }}/admin/collect?week_id=${PERIOD}"
          echo "Triggering async collection: $URL"

          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$URL" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}" \
            --http1.1 \
            --max-time 60)

          if [ -f response.json ]; then cat response.json; echo ""; fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Collection triggered (HTTP $HTTP_CODE)"
            echo "TRIGGERED=true" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: API returned HTTP $HTTP_CODE"
            echo "TRIGGERED=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Wait for collection to complete
        id: poll
        if: steps.trigger.outputs.TRIGGERED == 'true'
        run: |
          PERIOD="${{ steps.period.outputs.PERIOD }}"
          echo "Polling collection status for $PERIOD (up to 35 min)..."

          # Poll /admin/collect/status every 60s, up to 35 minutes
          # Capture HTTP code to detect 404/401/500 instead of hiding as "unknown"
          STATUS_ERRORS=0
          for i in $(seq 1 35); do
            HTTP_CODE=$(curl -sS -o status.json -w "%{http_code}" \
              "${{ secrets.API_BASE_URL }}/admin/collect/status?period_id=${PERIOD}" \
              -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}" \
              --http1.1 \
              --max-time 30)

            if [ "$HTTP_CODE" -ne 200 ]; then
              STATUS_ERRORS=$((STATUS_ERRORS + 1))
              echo "Attempt $i/35: HTTP $HTTP_CODE (status endpoint error)"
              if [ -f status.json ]; then cat status.json; echo ""; fi
              # After 3 consecutive non-200, fall back to content polling
              if [ "$STATUS_ERRORS" -ge 3 ]; then
                echo "Status endpoint unavailable, falling back to content polling..."
                TECH_CODE=$(curl -sS -o tech.json -w "%{http_code}" \
                  "${{ secrets.API_BASE_URL }}/tech/${PERIOD}" \
                  --http1.1 --max-time 30)
                if [ "$TECH_CODE" -eq 200 ] && [ -f tech.json ]; then
                  TOTAL=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('tech.json'))
              total = sum(len(v) for v in data.values() if isinstance(v, list))
              print(total)
          except Exception:
              print(0)
          ")
                  echo "Fallback poll $i/35: $TOTAL articles"
                  if [ "$TOTAL" -gt 0 ]; then
                    echo "Content ready via fallback for $PERIOD"
                    echo "RESULT=completed" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                fi
              fi
              sleep 60
              continue
            fi

            STATUS_ERRORS=0
            STATUS=$(python3 -c "import sys,json; print(json.load(open('status.json')).get('status','unknown'))" 2>/dev/null || echo "unknown")

            echo "Attempt $i/35: status=$STATUS"

            if [ "$STATUS" = "completed" ]; then
              echo "Collection completed for $PERIOD"
              echo "RESULT=completed" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "empty" ]; then
              echo "Collection $STATUS for $PERIOD"
              echo "RESULT=$STATUS" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 60
          done

          echo "WARNING: Collection still running after 35 minutes"
          echo "RESULT=timeout" >> "$GITHUB_OUTPUT"

      - name: Retry on failure
        id: retry
        if: steps.poll.outputs.RESULT == 'failed' || steps.poll.outputs.RESULT == 'empty'
        run: |
          PERIOD="${{ steps.period.outputs.PERIOD }}"
          echo "Retrying collection for $PERIOD (attempt 2)..."

          HTTP_CODE=$(curl -sS -o retry-response.json -w "%{http_code}" \
            -X POST "${{ secrets.API_BASE_URL }}/admin/collect?week_id=${PERIOD}" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}" \
            --http1.1 \
            --max-time 60)

          if [ -f retry-response.json ]; then cat retry-response.json; echo ""; fi

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Retry trigger failed (HTTP $HTTP_CODE)"
            echo "RETRY_OK=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Retry triggered, polling again (up to 35 min)..."
          RETRY_ERRORS=0
          for i in $(seq 1 35); do
            HTTP_CODE=$(curl -sS -o retry-status.json -w "%{http_code}" \
              "${{ secrets.API_BASE_URL }}/admin/collect/status?period_id=${PERIOD}" \
              -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}" \
              --http1.1 --max-time 30)

            if [ "$HTTP_CODE" -ne 200 ]; then
              RETRY_ERRORS=$((RETRY_ERRORS + 1))
              echo "Retry attempt $i/35: HTTP $HTTP_CODE"
              if [ "$RETRY_ERRORS" -ge 3 ]; then
                TOTAL=$(curl -sS "${{ secrets.API_BASE_URL }}/tech/${PERIOD}" --http1.1 --max-time 30 \
                  | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(len(v) for v in d.values() if isinstance(v,list)))" 2>/dev/null || echo "0")
                echo "Fallback poll: $TOTAL articles"
                if [ "$TOTAL" -gt 0 ]; then
                  echo "RETRY_OK=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
              sleep 60
              continue
            fi

            RETRY_ERRORS=0
            STATUS=$(python3 -c "import json; print(json.load(open('retry-status.json')).get('status','unknown'))" 2>/dev/null || echo "unknown")
            echo "Retry attempt $i/35: status=$STATUS"

            if [ "$STATUS" = "completed" ]; then
              echo "Retry succeeded for $PERIOD"
              echo "RETRY_OK=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "empty" ]; then
              echo "Retry also $STATUS for $PERIOD"
              echo "RETRY_OK=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            sleep 60
          done

          echo "Retry timed out for $PERIOD"
          echo "RETRY_OK=false" >> "$GITHUB_OUTPUT"
          exit 1

      # Newsletter is sent by a separate workflow (daily-newsletter.yml) at
      # 08:xx Berlin the next morning, not right after collection at 23:xx.
