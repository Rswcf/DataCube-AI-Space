name: Daily Collection

on:
  schedule:
    # Both slots are after midnight Berlin in winter and summer.
    - cron: "17 0 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      period_id:
        description: "Period ID (e.g. 2026-02-08 or 2026-kw06)"
        required: false

# Read the tested workflow runner and retain the self-keepalive permission.
permissions:
  contents: read
  actions: write

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Trigger daily collection
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Determine period
        id: period
        run: |
          PERIOD="${{ github.event.inputs.period_id }}"
          if [ -n "$PERIOD" ]; then
            echo "PERIOD=$PERIOD" >> "$GITHUB_OUTPUT"
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
            echo "Using manually requested period $PERIOD"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "schedule" ]; then
            PERIOD=$(TZ=Europe/Berlin date +%F)
            echo "PERIOD=$PERIOD" >> "$GITHUB_OUTPUT"
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Publish only a closed Berlin day. Source prefetch runs separately.
          SCHEDULE="${{ github.event.schedule }}"
          BERLIN_HOUR=$(TZ=Europe/Berlin date +%H)
          PERIOD=$(TZ=Europe/Berlin date -d "yesterday" +%F)

          echo "PERIOD=$PERIOD" >> "$GITHUB_OUTPUT"
          echo "SKIP=false" >> "$GITHUB_OUTPUT"
          echo "Resolved period $PERIOD from schedule '$SCHEDULE' at Berlin hour $BERLIN_HOUR"

      - name: Collect and verify published content
        id: publish
        if: steps.period.outputs.SKIP != 'true'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          PERIOD: ${{ steps.period.outputs.PERIOD }}
        run: python3 ai-hub-backend/scripts/daily_automation.py collect --period "$PERIOD"

      # Newsletter is sent by a separate workflow (daily-newsletter.yml) at
      # morning Berlin slots, after collection of the closed target day.

      - name: Ping IndexNow (Bing / ChatGPT Search / Copilot fast indexing)
        # Bing is our top search referrer and its index powers ChatGPT Search
        # and Microsoft Copilot. IndexNow gets same-day articles indexed within
        # hours instead of days. Key file lives at /<key>.txt on the frontend.
        if: steps.publish.outputs.RESULT == 'completed'
        run: |
          set +e
          SITE="${{ vars.SITE_URL || 'https://www.datacubeai.space' }}"
          KEY="6abe6c46976ff8d24ca82aeb2a2dfb4c"
          PERIOD="${{ steps.period.outputs.PERIOD }}"

          # Fresh article URLs (last 72h) come from the news sitemap; add the
          # day page and indexed-language homepages on top.
          curl -sS --max-time 60 "$SITE/news-sitemap.xml" -o news.xml || true
          python3 - "$SITE" "$KEY" "$PERIOD" <<'EOF'
          import json, re, sys, urllib.parse, urllib.request

          site, key, period = sys.argv[1], sys.argv[2], sys.argv[3]
          urls = set()
          try:
              xml = open("news.xml", encoding="utf-8").read()
              urls.update(re.findall(r"<loc>([^<]+)</loc>", xml))
          except OSError:
              pass
          for lang in ("de", "en", "zh"):
              urls.add(f"{site}/{lang}")
              urls.add(f"{site}/{lang}/week/{period}")

          payload = {
              "host": urllib.parse.urlsplit(site).hostname,
              "key": key,
              "keyLocation": f"{site}/{key}.txt",
              "urlList": sorted(urls)[:10000],
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  print(f"IndexNow: HTTP {resp.status}, submitted {len(payload['urlList'])} URLs")
          except Exception as exc:
              print(f"IndexNow ping failed (non-fatal): {exc}")
          EOF
          exit 0

      - name: Keepalive (reset 60-day inactivity auto-disable)
        # GitHub disables scheduled workflows 60 days after the last repo
        # activity (this bit us 2026-07-24). Re-enabling via API resets the
        # per-workflow timer. always(): must run even when gate steps skip.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-collect.yml/enable"
